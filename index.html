    <div id="google_translate_element" class="notranslate" translate="no" aria-hidden="true" style="display:none;"></div>

    <div id="root"></div>

    <!-- Google Translate Website Integration Script -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate && window.google.translate.TranslateElement) {
          try {
            new window.google.translate.TranslateElement(
              {
                pageLanguage: 'en',
                includedLanguages: 'en,hi,bn,gu,mr,ta,te,kn,ml,pa,ur',
                autoDisplay: false,
                multilanguagePage: true
              },
              'google_translate_element'
            );
          } catch (e) {
            console.warn('Google Translate initialization failed:', e);
          }
        }
      }
    </script>
    <script
      type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      async
      defer
    ></script>
